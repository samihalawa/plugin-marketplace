name: Spain assistant plugins

on:
  push:
    branches: [main]
    paths:
      - 'spain-assistant-suite/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/spain-assistants.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spain-assistant-publication
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.repository == 'samihalawa/plugin-marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Check source availability
        id: source
        shell: bash
        run: |
          if [ -f spain-assistant-suite/bootstrap/source-links.json ] || [ -f spain-assistant-suite/plugins/licita-espana/.claude-plugin/plugin.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Source import has not been supplied yet.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Import the explicitly selected public-release packages
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -f spain-assistant-suite/bootstrap/source-links.json ]; then
            python3 spain-assistant-suite/scripts/import_archives.py
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Install validation tools
        if: steps.source.outputs.ready == 'true'
        run: |
          python -m pip install pytest PyYAML Pillow
          npm install --global @anthropic-ai/claude-code@latest
          claude --version
      - name: Prepare public manifests and verify packages
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 spain-assistant-suite/scripts/prepare_public.py
          python3 spain-assistant-suite/scripts/verify_release.py
          claude plugin validate --strict .
          for p in spain-assistant-suite/plugins/*; do
            claude plugin validate --strict "$p"
          done
      - name: Publish only the Spain source and its Claude catalog
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'Sami Halawa'
          git config user.email '3243470+samihalawa@users.noreply.github.com'
          git add -- spain-assistant-suite .claude-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish seven independent Spain assistant plugins for Claude review'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Fresh anonymous marketplace installation
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          export GIT_TERMINAL_PROMPT=0
          unset GH_TOKEN GITHUB_TOKEN
          claude plugin marketplace add https://github.com/samihalawa/plugin-marketplace.git
          for p in licita-espana ayudas-espana boe-impact borme-intelligence catastro-pro ine-evidence spain-open-data; do
            claude plugin install "$p@sami-spain-assistants"
          done
          claude plugin list
          echo 'All seven plugins installed from the public GitHub marketplace in a fresh Claude configuration.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This verifies package installation, not model-based user acceptance or Anthropic directory approval.' >> "$GITHUB_STEP_SUMMARY"
